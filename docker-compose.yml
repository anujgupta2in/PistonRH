services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pistonrh
      POSTGRES_PASSWORD: pistonrh_dev
      POSTGRES_DB: pistonrh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pistonrh"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pistonrh:pistonrh_dev@postgres:5432/pistonrh
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
