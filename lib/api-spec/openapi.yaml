openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ME Piston Component Running Hours Record API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vessels
    description: Vessel management
  - name: monthly-rh
    description: Monthly running hour log
  - name: components
    description: Piston component management
  - name: cylinders
    description: Cylinder setup
  - name: movements
    description: Component movement log
  - name: dashboard
    description: Dashboard and alert computations
  - name: valve-components
    description: Fuel and exhaust valve component management
  - name: valve-movements
    description: Valve component movement log
  - name: valve-dashboard
    description: Valve dashboard and alert computations
  - name: auth
    description: Authentication
  - name: users
    description: User and vessel-access management (Technical Office only)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Vessels ───────────────────────────────────────────────────────────────
  /vessels:
    get:
      operationId: listVessels
      tags: [vessels]
      summary: List all vessels
      responses:
        "200":
          description: List of vessels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vessel"
    post:
      operationId: createVessel
      tags: [vessels]
      summary: Create a new vessel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VesselInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"

  /vessels/demo:
    post:
      operationId: loadDemoVessel
      tags: [vessels]
      summary: Load the demo vessel (MT. BOCHEM MARENGO)
      responses:
        "201":
          description: Demo vessel loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"

  /vessels/{vesselId}:
    get:
      operationId: getVessel
      tags: [vessels]
      summary: Get a vessel by ID
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vessel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
        "404":
          description: Not found
    patch:
      operationId: updateVessel
      tags: [vessels]
      summary: Update a vessel
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VesselUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
    delete:
      operationId: deleteVessel
      tags: [vessels]
      summary: Delete a vessel and all its data
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vessels/{vesselId}/reset:
    post:
      operationId: resetVesselData
      tags: [vessels]
      summary: Reset all operational data for a vessel
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Monthly RH ────────────────────────────────────────────────────────────
  /vessels/{vesselId}/monthly-rh:
    get:
      operationId: listMonthlyRh
      tags: [monthly-rh]
      summary: List monthly RH log entries (last 120)
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Monthly RH log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyRhEntry"
    post:
      operationId: addMonthlyRh
      tags: [monthly-rh]
      summary: Add a monthly RH log entry
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRhInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRhEntry"
        "400":
          description: Validation error

  /vessels/{vesselId}/monthly-rh/{entryId}:
    patch:
      operationId: updateMonthlyRhEntry
      tags: [monthly-rh]
      summary: Update a monthly RH log entry
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRhInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRhEntry"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      operationId: deleteMonthlyRhEntry
      tags: [monthly-rh]
      summary: Delete a monthly RH entry
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Components ────────────────────────────────────────────────────────────
  /vessels/{vesselId}/components:
    get:
      operationId: listComponents
      tags: [components]
      summary: List all piston components for a vessel
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Component list with live RH computed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
    post:
      operationId: createComponent
      tags: [components]
      summary: Register a new component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          description: Validation error

  /vessels/{vesselId}/components/{componentId}:
    get:
      operationId: getComponent
      tags: [components]
      summary: Get a single component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "404":
          description: Not found
    patch:
      operationId: updateComponent
      tags: [components]
      summary: Update a component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
    delete:
      operationId: deleteComponent
      tags: [components]
      summary: Delete a component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Cylinders ─────────────────────────────────────────────────────────────
  /vessels/{vesselId}/cylinders:
    get:
      operationId: listCylinders
      tags: [cylinders]
      summary: List all cylinders for a vessel
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cylinder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cylinder"

  /vessels/{vesselId}/cylinders/{cylinderNumber}:
    patch:
      operationId: updateCylinder
      tags: [cylinders]
      summary: Update a cylinder's assignment and overhaul records
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: cylinderNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CylinderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cylinder"

  # ─── Movements ─────────────────────────────────────────────────────────────
  /vessels/{vesselId}/movements:
    get:
      operationId: listMovements
      tags: [movements]
      summary: List movement log entries (last 200)
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movement log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementEntry"
    post:
      operationId: recordMovement
      tags: [movements]
      summary: Record a component movement
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEntry"
        "400":
          description: Validation error

  /vessels/{vesselId}/movements/{movementId}:
    delete:
      operationId: deleteMovement
      tags: [movements]
      summary: Delete a movement log entry
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: movementId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Dashboard & Alerts ────────────────────────────────────────────────────
  /vessels/{vesselId}/dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get full dashboard data (cylinder status, alerts, spares)
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /vessels/{vesselId}/recalculate-rh:
    post:
      operationId: recalculateComponentRh
      tags: [dashboard]
      summary: Recalculate all component RH from movement log
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResult"

  # ─── Valve Components ──────────────────────────────────────────────────────
  /vessels/{vesselId}/valves/{valveType}/components:
    get:
      operationId: listValveComponents
      tags: [valve-components]
      summary: List valve components
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
      responses:
        "200":
          description: List of valve components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValveComponent"
    post:
      operationId: createValveComponent
      tags: [valve-components]
      summary: Create a valve component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValveComponentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValveComponent"
        "400":
          description: Validation error

  /vessels/{vesselId}/valves/{valveType}/components/{componentId}:
    get:
      operationId: getValveComponent
      tags: [valve-components]
      summary: Get a single valve component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Valve component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValveComponent"
        "404":
          description: Not found
    patch:
      operationId: updateValveComponent
      tags: [valve-components]
      summary: Update a valve component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValveComponentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValveComponent"
        "404":
          description: Not found
    delete:
      operationId: deleteValveComponent
      tags: [valve-components]
      summary: Delete a valve component
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── Valve Dashboard ────────────────────────────────────────────────────────
  /vessels/{vesselId}/valves/{valveType}/dashboard:
    get:
      operationId: getValveDashboard
      tags: [valve-dashboard]
      summary: Get valve cylinder matrix dashboard
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
      responses:
        "200":
          description: Valve dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValveDashboardData"

  # ─── Valve Movements ────────────────────────────────────────────────────────
  /vessels/{vesselId}/valves/{valveType}/movements:
    get:
      operationId: listValveMovements
      tags: [valve-movements]
      summary: List valve movement log entries
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
      responses:
        "200":
          description: Valve movement log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValveMovementEntry"
    post:
      operationId: recordValveMovement
      tags: [valve-movements]
      summary: Record a valve movement
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValveMovementInput"
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValveMovementEntry"
        "400":
          description: Validation error

  /vessels/{vesselId}/valves/{valveType}/movements/{movementId}:
    delete:
      operationId: deleteValveMovement
      tags: [valve-movements]
      summary: Delete a valve movement entry
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: valveType
          in: path
          required: true
          schema:
            type: string
            enum: [fuel, exhaust]
        - name: movementId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vessels/{vesselId}/component-type-thresholds:
    get:
      operationId: listComponentTypeThresholds
      tags: [component-type-thresholds]
      summary: List all component-type thresholds for a vessel
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of component type thresholds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentTypeThreshold"
    post:
      operationId: createComponentTypeThreshold
      tags: [component-type-thresholds]
      summary: Create or upsert a component-type threshold
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentTypeThresholdInput"
      responses:
        "201":
          description: Created/upserted threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeThreshold"

  /vessels/{vesselId}/component-type-thresholds/{id}:
    patch:
      operationId: updateComponentTypeThreshold
      tags: [component-type-thresholds]
      summary: Update overhaul/warning RH for a component-type threshold
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentTypeThresholdUpdate"
      responses:
        "200":
          description: Updated threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeThreshold"
    delete:
      operationId: deleteComponentTypeThreshold
      tags: [component-type-thresholds]
      summary: Delete a component-type threshold
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in — sets an httpOnly session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and clear the session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  # ─── Users (Technical Office only) ────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{userId}/vessel-access:
    get:
      operationId: listUserVesselAccess
      tags: [users]
      summary: List the vessels a user has explicit access to
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vessel access list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserVesselAccessItem"
    post:
      operationId: grantVesselAccess
      tags: [users]
      summary: Grant a user access to a vessel
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantVesselAccessInput"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserVesselAccessItem"

  /users/{userId}/vessel-access/{vesselId}:
    delete:
      operationId: revokeVesselAccess
      tags: [users]
      summary: Revoke a user's access to a vessel
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: vesselId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── Vessel ──────────────────────────────────────────────────────────────
    Vessel:
      type: object
      required: [id, vesselName, numCylinders, crownOverhaulRh, crownWarningRh, dismantlingWarningRh, fuelValveOverhaulRh, fuelValveWarningRh, fuelValveSlotsPerCyl, exhaustValveOverhaulRh, exhaustValveWarningRh, createdAt]
      properties:
        id:
          type: integer
        vesselName:
          type: string
        imoNumber:
          type: ["string", "null"]
        vesselType:
          type: ["string", "null"]
        engineMake:
          type: ["string", "null"]
        engineModel:
          type: ["string", "null"]
        numCylinders:
          type: integer
        crownOverhaulRh:
          type: integer
        crownWarningRh:
          type: integer
        dismantlingWarningRh:
          type: integer
        fuelValveOverhaulRh:
          type: integer
        fuelValveWarningRh:
          type: integer
        fuelValveSlotsPerCyl:
          type: integer
        exhaustValveOverhaulRh:
          type: integer
        exhaustValveWarningRh:
          type: integer
        createdAt:
          type: string

    VesselInput:
      type: object
      required: [vesselName, numCylinders]
      properties:
        vesselName:
          type: string
          minLength: 1
        imoNumber:
          type: string
        vesselType:
          type: string
        engineMake:
          type: string
        engineModel:
          type: string
        numCylinders:
          type: integer
          minimum: 1
          maximum: 12
        crownOverhaulRh:
          type: integer
          default: 24000
        crownWarningRh:
          type: integer
          default: 20000
        dismantlingWarningRh:
          type: integer
          default: 16000
        fuelValveOverhaulRh:
          type: integer
          default: 8000
        fuelValveWarningRh:
          type: integer
          default: 6500
        fuelValveSlotsPerCyl:
          type: integer
          default: 2
        exhaustValveOverhaulRh:
          type: integer
          default: 8000
        exhaustValveWarningRh:
          type: integer
          default: 6500

    VesselUpdate:
      type: object
      properties:
        vesselName:
          type: string
          minLength: 1
        imoNumber:
          type: string
        vesselType:
          type: string
        engineMake:
          type: string
        engineModel:
          type: string
        numCylinders:
          type: integer
          minimum: 1
          maximum: 12
        crownOverhaulRh:
          type: integer
        crownWarningRh:
          type: integer
        dismantlingWarningRh:
          type: integer
        fuelValveOverhaulRh:
          type: integer
        fuelValveWarningRh:
          type: integer
        fuelValveSlotsPerCyl:
          type: integer
        exhaustValveOverhaulRh:
          type: integer
        exhaustValveWarningRh:
          type: integer

    # ─── Monthly RH ──────────────────────────────────────────────────────────
    MonthlyRhEntry:
      type: object
      required: [id, vesselId, logDate, meTotalRh, monthlyRh, createdAt]
      properties:
        id:
          type: integer
        vesselId:
          type: integer
        logDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        meTotalRh:
          type: number
        monthlyRh:
          type: number
        remarks:
          type: ["string", "null"]
        createdAt:
          type: string

    MonthlyRhInput:
      type: object
      required: [logDate, meTotalRh]
      properties:
        logDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        meTotalRh:
          type: number
          minimum: 0
        remarks:
          type: string

    # ─── Component ───────────────────────────────────────────────────────────
    Component:
      type: object
      required: [componentId, vesselId, componentType, condition, currentStatus, currentLocation, totalAccumulatedRh, createdAt]
      properties:
        componentId:
          type: string
        vesselId:
          type: integer
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
          description: "Per-component overhaul RH limit (overrides vessel default when set)"
        warningRh:
          type: ["integer", "null"]
          description: "Per-component warning RH threshold (overrides vessel default when set)"
        effectiveOverhaulRh:
          type: integer
          description: "Resolved overhaul RH: individual → type-level → vessel default"
        effectiveWarningRh:
          type: integer
          description: "Resolved warning RH: individual → type-level → vessel default"
        remarks:
          type: ["string", "null"]
        liveRh:
          type: number
          description: "Live total RH = stored + (current_me - fitted_at) if in service"
        alertStatus:
          type: string
        createdAt:
          type: string

    ComponentInput:
      type: object
      required: [componentId, componentType, condition, currentStatus]
      properties:
        componentId:
          type: string
          minLength: 1
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
          default: 0
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
          description: "Per-component overhaul RH limit (overrides vessel default when set)"
        warningRh:
          type: ["integer", "null"]
          description: "Per-component warning RH threshold (overrides vessel default when set)"
        remarks:
          type: string

    ComponentUpdate:
      type: object
      properties:
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
        warningRh:
          type: ["integer", "null"]
        remarks:
          type: string

    # ─── Cylinder ────────────────────────────────────────────────────────────
    Cylinder:
      type: object
      required: [id, vesselId, cylinderNumber]
      properties:
        id:
          type: integer
        vesselId:
          type: integer
        cylinderNumber:
          type: integer
        fittedComponentId:
          type: ["string", "null"]
        fittedAtMeRh:
          type: ["number", "null"]
        lastOverhaulRh:
          type: ["number", "null"]
        lastDismantlingRh:
          type: ["number", "null"]
        lastDecarbDate:
          type: ["string", "null"]
          description: "Date of the last decarb (unit overhaul) as YYYY-MM-DD"
        updatedAt:
          type: string

    CylinderUpdate:
      type: object
      properties:
        fittedComponentId:
          type: ["string", "null"]
        fittedAtMeRh:
          type: ["number", "null"]
        lastOverhaulRh:
          type: ["number", "null"]
        lastDismantlingRh:
          type: ["number", "null"]
        lastDecarbDate:
          type: ["string", "null"]
          description: "Date of the last decarb (unit overhaul) as YYYY-MM-DD"

    # ─── Movement ────────────────────────────────────────────────────────────
    MovementEntry:
      type: object
      required: [id, vesselId, movementDate, meRh, componentId, fromLocation, toLocation, action, rhAdded, createdAt]
      properties:
        id:
          type: integer
        vesselId:
          type: integer
        movementDate:
          type: string
        meRh:
          type: number
        componentId:
          type: string
        fromLocation:
          type: string
        toLocation:
          type: string
        action:
          type: string
        rhAdded:
          type: number
        remarks:
          type: ["string", "null"]
        createdAt:
          type: string

    MovementInput:
      type: object
      required: [movementDate, meRh, componentId, fromLocation, toLocation, action]
      properties:
        movementDate:
          type: string
        meRh:
          type: number
          minimum: 0
        componentId:
          type: string
        fromLocation:
          type: string
        toLocation:
          type: string
        action:
          type: string
        remarks:
          type: string

    # ─── Dashboard ───────────────────────────────────────────────────────────
    CylinderComponentStatus:
      type: object
      required: [componentId, componentType, condition, totalRh, limit, alertStatus]
      properties:
        componentId:
          type: string
        componentType:
          type: string
        condition:
          type: string
        totalRh:
          type: number
          description: Total lifetime running hours of the component
        limit:
          type: number
          description: Overhaul threshold in hours for this component type
        alertStatus:
          type: string

    CylinderStatus:
      type: object
      required: [cylinder, components, rhSinceOverhaul, rhSinceDismantling, overallAlertStatus, dismantlingAlert]
      properties:
        cylinder:
          type: integer
        components:
          type: array
          items:
            $ref: "#/components/schemas/CylinderComponentStatus"
        rhSinceOverhaul:
          type: number
        rhSinceDismantling:
          type: number
        overallAlertStatus:
          type: string
        dismantlingAlert:
          type: string

    AlertItem:
      type: object
      required: [cylinder, componentId, type, status, totalRh, limit]
      properties:
        cylinder:
          type: integer
        componentId:
          type: string
        type:
          type: string
        status:
          type: string
        totalRh:
          type: number
        limit:
          type: number
        isChild:
          type: boolean
          description: "True if this alert is for a child component (nozzle, spring, etc.) rather than the main Unit/Fuel/Exhaust Valve component"

    DashboardData:
      type: object
      required: [currentMeRh, cylinderStatus, spareComponents, ashoreComponents, alerts, alertConfig]
      properties:
        currentMeRh:
          type: number
        cylinderStatus:
          type: array
          items:
            $ref: "#/components/schemas/CylinderStatus"
        spareComponents:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        ashoreComponents:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertItem"
        alertConfig:
          type: object
          required: [crownOverhaulRh, crownWarningRh, dismantlingWarningRh]
          properties:
            crownOverhaulRh:
              type: integer
            crownWarningRh:
              type: integer
            dismantlingWarningRh:
              type: integer

    RecalcResult:
      type: object
      required: [count, details]
      properties:
        count:
          type: integer
        details:
          type: array
          items:
            type: object
            required: [componentId, oldRh, newRh]
            properties:
              componentId:
                type: string
              oldRh:
                type: number
              newRh:
                type: number

    # ─── Valve Component ─────────────────────────────────────────────────────
    ValveComponent:
      type: object
      required: [id, componentId, vesselId, valveType, componentType, condition, currentStatus, currentLocation, totalAccumulatedRh, createdAt]
      properties:
        id:
          type: integer
        componentId:
          type: string
        vesselId:
          type: integer
        valveType:
          type: string
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
          description: "Per-component overhaul RH limit (overrides vessel default when set)"
        warningRh:
          type: ["integer", "null"]
          description: "Per-component warning RH threshold (overrides vessel default when set)"
        effectiveOverhaulRh:
          type: integer
          description: "Resolved overhaul RH: individual → type-level → vessel default"
        effectiveWarningRh:
          type: integer
          description: "Resolved warning RH: individual → type-level → vessel default"
        parentComponentId:
          type: ["integer", "null"]
          description: "If set, this is a child (nozzle, spring, etc.) whose location/status/RH clock are inherited from the parent valve"
        lastOverhaulDate:
          type: ["string", "null"]
          description: "Date of the last overhaul as YYYY-MM-DD"
        lastOverhaulRh:
          type: ["number", "null"]
          description: "The component's own lifetime RH at its last overhaul; overhaul-due status counts hours since this point"
        rhSinceOverhaul:
          type: number
          description: "Live RH minus lastOverhaulRh (equals liveRh when no overhaul recorded) — the basis for alertStatus"
        remarks:
          type: ["string", "null"]
        liveRh:
          type: number
        alertStatus:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/ValveChildComponentStatus"
        createdAt:
          type: string

    ValveComponentInput:
      type: object
      required: [componentId, componentType, condition, currentStatus]
      properties:
        componentId:
          type: string
          minLength: 1
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
          default: 0
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
          description: "Per-component overhaul RH limit (overrides vessel default when set)"
        warningRh:
          type: ["integer", "null"]
          description: "Per-component warning RH threshold (overrides vessel default when set)"
        parentComponentId:
          type: ["integer", "null"]
          description: "Set to attach this component as a child (nozzle, spring, etc.) of an existing top-level valve component"
        lastOverhaulDate:
          type: ["string", "null"]
          description: "Date of the last overhaul as YYYY-MM-DD"
        lastOverhaulRh:
          type: ["number", "null"]
          description: "The component's own lifetime RH at its last overhaul"
        remarks:
          type: string

    ValveComponentUpdate:
      type: object
      properties:
        componentType:
          type: string
        condition:
          type: string
        currentStatus:
          type: string
        currentLocation:
          type: string
        totalAccumulatedRh:
          type: number
        fittedAtMeRh:
          type: ["number", "null"]
        overhaulRh:
          type: ["integer", "null"]
        warningRh:
          type: ["integer", "null"]
        parentComponentId:
          type: ["integer", "null"]
          description: "Set to attach, or null to detach, this component from a parent valve"
        lastOverhaulDate:
          type: ["string", "null"]
          description: "Date of the last overhaul as YYYY-MM-DD"
        lastOverhaulRh:
          type: ["number", "null"]
          description: "The component's own lifetime RH at its last overhaul"
        remarks:
          type: string

    # ─── Valve Dashboard ──────────────────────────────────────────────────────
    ValveChildComponentStatus:
      type: object
      required: [componentId, componentType, condition, totalRh, limit, alertStatus]
      description: A child component (nozzle, spring, etc.) nested under its parent valve; totalRh is inherited from the parent, limit/alertStatus use the child's own thresholds.
      properties:
        componentId:
          type: string
        componentType:
          type: string
        condition:
          type: string
        totalRh:
          type: number
          description: Inherited from the parent valve's live RH
        limit:
          type: number
          description: This child's own overhaul threshold in hours
        alertStatus:
          type: string

    ValveSlotStatus:
      type: object
      required: [slotNumber, componentId, componentType, condition, totalRh, limit, alertStatus, children]
      properties:
        slotNumber:
          type: integer
        componentId:
          type: string
        componentType:
          type: string
        condition:
          type: string
        totalRh:
          type: number
          description: Total lifetime running hours of the component
        limit:
          type: number
          description: Overhaul threshold in hours for this valve type
        alertStatus:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/ValveChildComponentStatus"

    ValveCylinderStatus:
      type: object
      required: [cylinder, slots, overallAlertStatus, rhSinceOverhaul]
      properties:
        cylinder:
          type: integer
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ValveSlotStatus"
        overallAlertStatus:
          type: string
          description: "Driven by the Unit's own overhaul cycle (rhSinceOverhaul vs. crownOverhaulRh) — the same crown-based clock shown on the piston dashboard, not the valve's own wear"
        rhSinceOverhaul:
          type: number
          description: "Hours run since this cylinder unit was last overhauled"

    ValveDashboardData:
      type: object
      required: [currentMeRh, valveType, cylinderStatus, spareComponents, ashoreComponents, alerts, alertConfig, crownOverhaulRh, crownWarningRh]
      properties:
        currentMeRh:
          type: number
        valveType:
          type: string
        crownOverhaulRh:
          type: integer
          description: "Vessel-wide Unit (cylinder) overhaul interval — same value used on the piston dashboard"
        crownWarningRh:
          type: integer
        cylinderStatus:
          type: array
          items:
            $ref: "#/components/schemas/ValveCylinderStatus"
        spareComponents:
          type: array
          items:
            $ref: "#/components/schemas/ValveComponent"
        ashoreComponents:
          type: array
          items:
            $ref: "#/components/schemas/ValveComponent"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertItem"
        alertConfig:
          type: object
          required: [overhaulRh, warningRh]
          properties:
            overhaulRh:
              type: integer
            warningRh:
              type: integer

    # ─── Valve Movement ───────────────────────────────────────────────────────
    ValveMovementEntry:
      type: object
      required: [id, vesselId, valveType, movementDate, meRh, componentId, fromLocation, toLocation, action, rhAdded, createdAt]
      properties:
        id:
          type: integer
        vesselId:
          type: integer
        valveType:
          type: string
        movementDate:
          type: string
        meRh:
          type: number
        componentId:
          type: string
        fromLocation:
          type: string
        toLocation:
          type: string
        action:
          type: string
        rhAdded:
          type: number
        remarks:
          type: ["string", "null"]
        createdAt:
          type: string

    ValveMovementInput:
      type: object
      required: [movementDate, meRh, componentId, fromLocation, toLocation, action]
      properties:
        movementDate:
          type: string
        meRh:
          type: number
          minimum: 0
        componentId:
          type: string
        fromLocation:
          type: string
        toLocation:
          type: string
        action:
          type: string
        slotNumber:
          type: integer
          description: "Slot number for fuel valves (1-based). Defaults to 1 for exhaust."
        remarks:
          type: string

    # ─── Component Type Thresholds ──────────────────────────────────────────
    ComponentTypeThreshold:
      type: object
      required: [id, vesselId, category, componentType, overhaulRh, warningRh]
      properties:
        id:
          type: integer
        vesselId:
          type: integer
        category:
          type: string
          description: "Grouping category, e.g. Piston, Fuel Valve, Exhaust Valve"
        componentType:
          type: string
          description: "Specific component type, e.g. Piston Crown, Piston Skirt"
        overhaulRh:
          type: integer
        warningRh:
          type: integer

    ComponentTypeThresholdInput:
      type: object
      required: [category, componentType, overhaulRh, warningRh]
      properties:
        category:
          type: string
        componentType:
          type: string
        overhaulRh:
          type: integer
          minimum: 0
        warningRh:
          type: integer
          minimum: 0

    ComponentTypeThresholdUpdate:
      type: object
      properties:
        overhaulRh:
          type: integer
          minimum: 0
        warningRh:
          type: integer
          minimum: 0

    # ─── Auth & Users ────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserProfile:
      type: object
      required: [id, email, fullName, role, isActive]
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [vessel_officer, technical_office]
        isActive:
          type: boolean
        vesselIds:
          type: array
          items:
            type: integer
          description: "Accessible vessel ids; omitted/empty for technical_office (implicit fleet-wide access)"

    CreateUserInput:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        role:
          type: string
          enum: [vessel_officer, technical_office]

    UpdateUserInput:
      type: object
      properties:
        fullName:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [vessel_officer, technical_office]
        isActive:
          type: boolean

    UserVesselAccessItem:
      type: object
      required: [vesselId, vesselName]
      properties:
        vesselId:
          type: integer
        vesselName:
          type: string

    GrantVesselAccessInput:
      type: object
      required: [vesselId]
      properties:
        vesselId:
          type: integer
