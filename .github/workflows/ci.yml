name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pistonrh
          POSTGRES_PASSWORD: pistonrh_dev
          POSTGRES_DB: pistonrh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pistonrh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pistonrh:pistonrh_dev@localhost:5432/pistonrh
      JWT_SECRET: ci-only-secret
      CORS_ORIGIN: http://localhost:22244
      PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client from OpenAPI spec
        run: pnpm run codegen

      - name: Type-check
        run: pnpm run typecheck

      - name: Push database schema
        run: pnpm run db:push

      - name: Build
        run: pnpm run build
